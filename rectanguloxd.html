<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Area de un rectangulo</title>
    <style>
        body { font-family: 'Lucida Sans', sans-serif; max-width: 400px; margin: 50px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
        .campo { margin-bottom: 12px; }
        label { display: block; margin-bottom: 4px; font-weight: bold; }
        input { width: 100%; padding: 8px; box-sizing: border-box; margin-bottom: 12px; }
        button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        #resultado { margin-top: 15px; padding: 10px; border-radius: 4px; display: none; background-color: #be7acc; }
    </style>
</head>
<body>
    <h2>Area de un rectangulo</h2>
    <div class="campo">
        <label for="nombre">Ingrese el nombre:</label>        
        <input type="text" id="nombre">
        
        <label for="Base">Ingrese la Base:</label>
        <input type="number" id="Base" step="0.1">

        <label for="Altura">Ingrese la Altura:</label>
        <input type="number" id="Altura" step="0.1">

        <button onclick="calcularsuma()">Calcular el </button>
    </div>
    <div id="resultado"></div>
    <script>
        function calcularsuma() {
            const nombre = document.getElementById("nombre").value.trim();
            const Base = parseFloat(document.getElementById("Base").value);
            const Altura = parseFloat(document.getElementById("Altura").value);
            const divResultado = document.getElementById("resultado");

            if (!nombre || isNaN(Base) || isNaN(Altura)) {
                alert("Por favor, complete todos los campos correctamente.");
                return;
            }

            if (Base < 0 || Base > 100 || Altura < 0 || Altura > 100) {
                alert("Los números deben estar entre 0 y 100.");
                return;
            }

            const suma = Base * Altura

            divResultado.style.display = "block";
            divResultado.innerHTML = `
                <p><strong>Estudiante:</strong> ${nombre}</p>
                <p><strong>Suma:</strong> ${suma.toFixed(2)}</p>
            `;
        }
    </script>
</body>
</html>
